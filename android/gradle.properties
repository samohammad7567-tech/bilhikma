org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Network resilience for downloading Flutter engine artifacts from download.flutter.io
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.initial.backoff=2000
org.gradle.internal.repository.max.tentatives=10
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.daemon=true
