name: iOS Build & Release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the signed .ipa to TestFlight"
        type: boolean
        default: false

  push:
    branches:
      - main
      - fix_password_hint

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.4"
  FLUTTER_CHANNEL: "stable"
  BUILD_NUMBER_BASE: "100"

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Select Xcode and show toolchain
        id: toolchain
        run: |
          set -euo pipefail

          sw_vers

          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app

          # Pick the newest installed Xcode rather than the image default,
          # which is not always the latest one available.
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$NEWEST/Contents/Developer"

          xcodebuild -version

          XCODE_MAJOR="$(
            xcodebuild -version |
            head -n1 |
            sed -E 's/^Xcode[[:space:]]+([0-9]+).*/\1/'
          )"

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Selected Xcode .. $NEWEST"
          echo "iOS SDK ......... $IOS_SDK"

          echo "xcode_major=$XCODE_MAJOR" >> "$GITHUB_OUTPUT"
          echo "ios_sdk=$IOS_SDK" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Ensure CocoaPods
        run: |
          set -euo pipefail

          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods not found on the runner; installing."
            brew install cocoapods
          fi

          pod --version

      - name: Resolve version and build number
        id: version
        run: |
          set -euo pipefail

          BUILD_NAME="$(
            grep -m1 '^version:' pubspec.yaml |
            sed -E 's/^version:[[:space:]]*//' |
            cut -d'+' -f1
          )"

          BUILD_NUMBER="$(( BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER ))"

          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          echo "Building Bilhikma $BUILD_NAME ($BUILD_NUMBER)"

      - name: Detect signing configuration
        id: signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail

          SIGNED=false
          ASC=false

          if [ -n "$CERT_B64" ] && \
             [ -n "$CERT_PASSWORD" ] && \
             [ -n "$PROFILE_B64" ]; then
            SIGNED=true
          fi

          if [ -n "$ASC_KEY_ID" ] && \
             [ -n "$ASC_ISSUER_ID" ] && \
             [ -n "$ASC_KEY_B64" ]; then
            ASC=true
          fi

          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "asc=$ASC" >> "$GITHUB_OUTPUT"

          if [ "$SIGNED" = "true" ]; then
            echo "Signing secrets present: building a SIGNED .ipa."
          else
            echo "::warning::Signing secrets missing; building UNSIGNED."
          fi

      - name: Import certificate and provisioning profile
        if: steps.signing.outputs.signed == 'true'
        id: identity
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          METHOD_OVERRIDE: ${{ vars.IOS_EXPORT_METHOD }}
          XCODE_MAJOR: ${{ steps.toolchain.outputs.xcode_major }}
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/signing"
          mkdir -p "$WORK"

          KEYCHAIN_PATH="$WORK/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          # ---- temporary keychain ----------------------------------------
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          security default-keychain -s "$KEYCHAIN_PATH"

          # ---- signing certificate ---------------------------------------
          printf '%s' "$CERT_B64" | base64 --decode > "$WORK/cert.p12"

          security import "$WORK/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -A \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            awk -F'"' 'NF > 1 { print $2; exit }'
          )"

          if [ -z "$IDENTITY" ]; then
            echo "::error::No code-signing identity found in the .p12."
            exit 1
          fi

          # ---- provisioning profile --------------------------------------
          printf '%s' "$PROFILE_B64" | base64 --decode \
            > "$WORK/profile.mobileprovision"

          security cms -D -i "$WORK/profile.mobileprovision" \
            > "$WORK/profile.plist"

          read_profile() {
            /usr/libexec/PlistBuddy -c "Print $1" "$WORK/profile.plist" \
              2>/dev/null || true
          }

          PROFILE_NAME="$(read_profile ':Name')"
          PROFILE_UUID="$(read_profile ':UUID')"
          TEAM_ID="$(read_profile ':TeamIdentifier:0')"
          APP_ID="$(read_profile ':Entitlements:application-identifier')"
          BUNDLE_ID="${APP_ID#"$TEAM_ID".}"

          if [ -z "$PROFILE_UUID" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Could not parse the provisioning profile."
            exit 1
          fi

          for DEST in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          do
            mkdir -p "$DEST"
            cp "$WORK/profile.mobileprovision" \
              "$DEST/$PROFILE_UUID.mobileprovision"
          done

          # ---- derive the export method from the profile ------------------
          ALL_DEVICES="$(read_profile ':ProvisionsAllDevices')"
          HAS_DEVICES="$(read_profile ':ProvisionedDevices:0')"
          TASK_ALLOW="$(read_profile ':Entitlements:get-task-allow')"

          if [ "$ALL_DEVICES" = "true" ]; then
            METHOD="enterprise"
          elif [ -n "$HAS_DEVICES" ]; then
            if [ "$TASK_ALLOW" = "true" ]; then
              METHOD="development"
            else
              METHOD="ad-hoc"
            fi
          else
            METHOD="app-store"
          fi

          if [ -n "${METHOD_OVERRIDE:-}" ]; then
            METHOD="$METHOD_OVERRIDE"
            echo "Export method overridden by vars.IOS_EXPORT_METHOD."
          fi

          # Xcode 16 renamed the App Store destination.
          EXPORT_METHOD="$METHOD"
          if [ "$METHOD" = "app-store" ] && \
             [ "${XCODE_MAJOR:-0}" -ge 16 ]; then
            EXPORT_METHOD="app-store-connect"
          fi

          echo "Identity ....... $IDENTITY"
          echo "Profile ........ $PROFILE_NAME ($PROFILE_UUID)"
          echo "Team ........... $TEAM_ID"
          echo "Bundle id ...... $BUNDLE_ID"
          echo "Export method .. $EXPORT_METHOD"

          {
            echo "identity=$IDENTITY"
            echo "profile_name=$PROFILE_NAME"
            echo "profile_uuid=$PROFILE_UUID"
            echo "team_id=$TEAM_ID"
            echo "bundle_id=$BUNDLE_ID"
            echo "method=$METHOD"
            echo "export_method=$EXPORT_METHOD"
          } >> "$GITHUB_OUTPUT"

      - name: Apply signing settings to the Xcode project
        if: steps.signing.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.identity.outputs.identity }}
          PROFILE_NAME: ${{ steps.identity.outputs.profile_name }}
          TEAM_ID: ${{ steps.identity.outputs.team_id }}
          METHOD: ${{ steps.identity.outputs.method }}
        run: |
          set -euo pipefail

          XCCONFIG="ios/Flutter/Release.xcconfig"

          # Release.xcconfig is the Runner target's base configuration, so
          # anything written here overrides the project-level signing
          # defaults ("iPhone Developer" / automatic signing).
          {
            echo ""
            echo "// --- injected by CI, never committed ---"
            echo "DEVELOPMENT_TEAM = $TEAM_ID"
            echo "CODE_SIGN_STYLE = Manual"
            echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME"
            echo "CODE_SIGN_IDENTITY = $IDENTITY"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = $IDENTITY"
          } >> "$XCCONFIG"

          echo "$XCCONFIG:"
          cat "$XCCONFIG"

          # App Store and ad-hoc uploads are rejected when aps-environment
          # is "development". Flutter shares one entitlements file across
          # configurations, so patch it here for distribution exports only.
          if [ "$METHOD" != "development" ]; then
            ENT="ios/Runner/Runner.entitlements"

            if /usr/libexec/PlistBuddy -c 'Print :aps-environment' "$ENT" \
               >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy \
                -c 'Set :aps-environment production' "$ENT"
              echo "Set aps-environment=production for the $METHOD export."
            fi
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          set -euo pipefail

          if [ -d test ] && \
             find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No tests found; skipping."
          fi

      - name: Write ExportOptions.plist
        if: steps.signing.outputs.signed == 'true'
        env:
          EXPORT_METHOD: ${{ steps.identity.outputs.export_method }}
          TEAM_ID: ${{ steps.identity.outputs.team_id }}
          BUNDLE_ID: ${{ steps.identity.outputs.bundle_id }}
          PROFILE_NAME: ${{ steps.identity.outputs.profile_name }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          set -euo pipefail

          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$PLIST"

          plutil -create xml1 "$PLIST"

          add() { /usr/libexec/PlistBuddy -c "Add $1" "$PLIST"; }

          add ":method string $EXPORT_METHOD"
          add ":teamID string $TEAM_ID"
          add ":signingStyle string manual"
          add ":signingCertificate string $IDENTITY"
          add ":provisioningProfiles dict"
          add ":provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME"
          add ":stripSwiftSymbols bool true"
          add ":uploadSymbols bool true"
          add ":compileBitcode bool false"
          add ":destination string export"

          plutil -lint "$PLIST"
          cat "$PLIST"

          echo "EXPORT_OPTIONS_PLIST=$PLIST" >> "$GITHUB_ENV"

      - name: Build signed .ipa
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail

          flutter build ipa \
            --release \
            --build-name "${{ steps.version.outputs.build_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --export-options-plist "$EXPORT_OPTIONS_PLIST"

      - name: Build unsigned app
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --no-codesign \
            --build-name "${{ steps.version.outputs.build_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}"

      - name: Collect artifacts
        id: artifacts
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          METHOD: ${{ steps.identity.outputs.method }}
        run: |
          set -euo pipefail

          OUT="build/ios/artifacts"
          BASE="Bilhikma-${{ steps.version.outputs.build_name }}-${{ steps.version.outputs.build_number }}"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          if [ "$SIGNED" = "true" ]; then
            IPA="$(
              find build/ios/ipa -maxdepth 1 -name "*.ipa" -print -quit
            )"

            if [ -z "$IPA" ]; then
              echo "::error::No signed .ipa was produced."
              exit 1
            fi

            TARGET="$OUT/$BASE-$METHOD.ipa"
            cp "$IPA" "$TARGET"

            echo "ipa_path=$TARGET" >> "$GITHUB_OUTPUT"

            echo "Signed payload:"
            unzip -l "$TARGET" | head -n 6
          else
            APP="$(
              find build/ios/iphoneos \
                -maxdepth 1 -type d -name "*.app" -print -quit
            )"

            if [ -z "$APP" ]; then
              echo "::error::Unsigned .app was not found."
              exit 1
            fi

            mkdir -p "$OUT/Payload"
            cp -R "$APP" "$OUT/Payload/"

            (
              cd "$OUT"
              zip -qr "$BASE-unsigned.ipa" Payload
              rm -rf Payload
            )
          fi

          echo "Artifacts:"
          ls -lh "$OUT"

      - name: Upload to TestFlight
        if: >-
          steps.signing.outputs.signed == 'true' &&
          steps.signing.outputs.asc == 'true' &&
          steps.identity.outputs.method == 'app-store' &&
          (inputs.upload_to_testflight ||
           github.ref == 'refs/heads/main')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_BASE64 }}
          IPA_PATH: ${{ steps.artifacts.outputs.ipa_path }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/private_keys"

          printf '%s' "$ASC_KEY_B64" | base64 --decode \
            > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo "Uploaded. TestFlight processing takes a few minutes."

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bilhikma-ios-${{ steps.version.outputs.build_name }}-${{ steps.version.outputs.build_number }}
          path: build/ios/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            build/ios/**
            ios/Flutter/Release.xcconfig
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up signing assets
        if: always()
        env:
          PROFILE_UUID: ${{ steps.identity.outputs.profile_uuid }}
        run: |
          set -euo pipefail

          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f \
              "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi

          rm -rf "$RUNNER_TEMP/signing" "$HOME/private_keys"

          git checkout -- \
            ios/Flutter/Release.xcconfig \
            ios/Runner/Runner.entitlements || true
