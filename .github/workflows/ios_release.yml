name: iOS Release

# Builds a signed iOS IPA and ships it to Firebase App Distribution, which
# emails the testers an install link. Triggered manually, or by pushing an
# `ios-v*` tag.
#
# Required repository secrets are documented in docs/ios_release_setup.md.

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Xcode export method"
        type: choice
        default: ad-hoc
        options:
          - ad-hoc
          - app-store
          - development
          - enterprise
      testers:
        description: "Comma-separated tester emails (blank = the Fastfile default)"
        type: string
        default: ""
      tester_groups:
        description: "Comma-separated Firebase App Distribution group aliases"
        type: string
        default: ""
      release_notes:
        description: "Release notes (blank = generated from version + recent commits)"
        type: string
        default: ""
      build_number:
        description: "iOS build number (blank = BUILD_NUMBER_BASE + run number)"
        type: string
        default: ""
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.4"
  FLUTTER_CHANNEL: "stable"
  RUBY_VERSION: "3.3"
  # pubspec sits at +8; this keeps CI build numbers strictly above local ones.
  BUILD_NUMBER_BASE: "100"

jobs:
  build-and-distribute:
    name: Build & distribute iOS
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release notes read the last few commit subjects.
          fetch-depth: 20

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Ruby & fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ios

      - name: Expose bundled CocoaPods on PATH
        # setup-ruby swaps the active Ruby, which leaves the preinstalled
        # system `pod` broken. Flutter shells out to `pod` by name, so point it
        # at the Gemfile's CocoaPods instead.
        working-directory: ios
        run: |
          set -euo pipefail
          bundle binstubs cocoapods --path "$GITHUB_WORKSPACE/.ci-bin" --force
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"
          # Lets the binstub resolve the bundle no matter which directory
          # Flutter invokes `pod` from.
          echo "BUNDLE_GEMFILE=$GITHUB_WORKSPACE/ios/Gemfile" >> "$GITHUB_ENV"

      - name: Verify CocoaPods
        run: pod --version

      - name: Resolve version and build number
        id: version
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_NAME="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1)"
          if [ -n "${INPUT_BUILD_NUMBER:-}" ]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          else
            BUILD_NUMBER="$(( BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER ))"
          fi
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building Bilhikma $BUILD_NAME ($BUILD_NUMBER)"

      - name: Check required secrets
        id: secret_check
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD \
                      IOS_PROVISION_PROFILE_BASE64 FIREBASE_IOS_APP_ID \
                      FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name (see docs/ios_release_setup.md)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          if [ -n "${MAIL_USERNAME:-}" ] && [ -n "${MAIL_PASSWORD:-}" ]; then
            echo "mail_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "mail_enabled=false" >> "$GITHUB_OUTPUT"
            echo "SMTP secrets not set - relying on the Firebase App Distribution email only."
          fi

      - name: Restore GoogleService-Info.plist
        # Optional: only overwrites the committed file when the secret is set.
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Wrote ios/Runner/GoogleService-Info.plist from secret."
          fi
          if [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            echo "::error::ios/Runner/GoogleService-Info.plist is missing."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/GoogleService-Info.plist

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          set -euo pipefail
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No tests found; skipping."
          fi

      - name: Build Flutter iOS bundle (unsigned)
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name "${{ steps.version.outputs.build_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}"

      - name: Sign, archive and upload to Firebase App Distribution
        working-directory: ios
        env:
          # --- Apple signing ---
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          # --- Firebase ---
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTERS: ${{ inputs.testers }}
          FIREBASE_TESTER_GROUPS: ${{ inputs.tester_groups }}
          # --- Build metadata used in the release notes ---
          IOS_BUILD_NAME: ${{ steps.version.outputs.build_name }}
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          IOS_EXPORT_METHOD: ${{ inputs.export_method || 'ad-hoc' }}
          IOS_RELEASE_NOTES: ${{ inputs.release_notes }}
          # --- fastlane behaviour ---
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          set -euo pipefail
          # Values arrive via the environment, never interpolated into this
          # script, so tester emails and notes cannot inject shell syntax.
          if [ -n "${IOS_RELEASE_NOTES:-}" ]; then
            bundle exec fastlane ios distribute release_notes:"$IOS_RELEASE_NOTES"
          else
            bundle exec fastlane ios distribute
          fi

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilhikma-ios-${{ steps.version.outputs.build_name }}-${{ steps.version.outputs.build_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/*.dSYM.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            build/ios/ipa/logs/**
            ios/fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Email the build link
        # Belt and braces. Firebase already emails the testers; this also mails
        # whoever is in MAIL_TO. Skipped when the SMTP secrets are absent.
        if: success() && steps.secret_check.outputs.mail_enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || '465' }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Bilhikma CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO || 'mohammadwork199700@gmail.com' }}
          subject: "Bilhikma iOS ${{ steps.version.outputs.build_name }} (${{ steps.version.outputs.build_number }}) is ready"
          body: |
            A new Bilhikma iOS build was released to Firebase App Distribution.

            Version:  ${{ steps.version.outputs.build_name }} (${{ steps.version.outputs.build_number }})
            Branch:   ${{ github.ref_name }}
            Commit:   ${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Open the install link from the Firebase App Distribution email, or
            from the Firebase console under App Distribution.

            The signed .ipa is also attached to the workflow run as an artifact.
