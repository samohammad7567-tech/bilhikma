name: iOS Build (Unsigned)

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - fix_password_hint

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.4"
  FLUTTER_CHANNEL: "stable"
  BUILD_NUMBER_BASE: "100"

jobs:
  build-ios:
    name: Build unsigned iOS
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Ensure CocoaPods
        run: |
          set -euo pipefail

          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods not found on the runner; installing."
            brew install cocoapods
          fi

          pod --version

      - name: Resolve version and build number
        id: version
        run: |
          set -euo pipefail

          BUILD_NAME="$(
            grep -m1 '^version:' pubspec.yaml |
            sed -E 's/^version:[[:space:]]*//' |
            cut -d'+' -f1
          )"

          BUILD_NUMBER="$(( BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER ))"

          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          echo "Building Bilhikma $BUILD_NAME ($BUILD_NUMBER)"

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          set -euo pipefail

          if [ -d test ] && \
             find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No tests found; skipping."
          fi

      - name: Build Flutter iOS app (unsigned)
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --no-codesign \
            --build-name "${{ steps.version.outputs.build_name }}" \
            --build-number "${{ steps.version.outputs.build_number }}"

      - name: Package unsigned .app and .ipa
        run: |
          set -euo pipefail

          APP_PATH="$(
            find build/ios/iphoneos \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "::error::Unsigned .app was not found."
            exit 1
          fi

          echo "Unsigned iOS application: $APP_PATH"

          BASE="Bilhikma-${{ steps.version.outputs.build_name }}-${{ steps.version.outputs.build_number }}"

          rm -rf build/ios/artifacts
          mkdir -p build/ios/artifacts/Payload

          cp -R "$APP_PATH" build/ios/artifacts/Payload/

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "build/ios/artifacts/$BASE-unsigned-app.zip"

          (
            cd build/ios/artifacts
            zip -qr "$BASE-unsigned.ipa" Payload
            rm -rf Payload
          )

          echo "Created artifacts:"
          ls -lh build/ios/artifacts/

      - name: Upload unsigned iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bilhikma-ios-unsigned-${{ steps.version.outputs.build_name }}-${{ steps.version.outputs.build_number }}
          path: |
            build/ios/artifacts/*.ipa
            build/ios/artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: build/ios/**
          if-no-files-found: ignore
          retention-days: 7
